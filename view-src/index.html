<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chart</title>
    <style>
      :root {
        --bg: #ffffff; --fg: #18181b; --muted: #71717a; --card: #fafafa;
        --border: #e4e4e7; --accent: #4f46e5; --accent-fg: #ffffff;
      }
      :root[data-theme="dark"] {
        --bg: #18181b; --fg: #fafafa; --muted: #a1a1aa; --card: #27272a;
        --border: #3f3f46; --accent: #6366f1; --accent-fg: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      h3 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
      .empty { color: var(--muted); padding: 24px; text-align: center; }
      .chart { min-height: 320px; width: 100%; }
      .chart + .chart { margin-top: 24px; }
      .chart canvas { max-width: 100%; }
    </style>
  </head>
  <body>
    <div id="root"><div class="empty">Loading…</div></div>
    <script>/*__BUNDLE__*/</script>
  </body>
</html>
